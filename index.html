<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小智题库 · 反比例函数</title>
<style>
:root{--ink:#0d2b6b;--blue:#1f5fd6;--sky:#e8f1fe;--line:#c9dbf7;--orange:#f08a24;--ok:#1a9b5c;--bg:#f4f8ff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","PingFang SC","Heiti SC",sans-serif}
.m{font-family:"Times New Roman",serif;font-style:italic;white-space:nowrap}
.m .n{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;font-size:1em;line-height:1.15}
.fr>span{padding:0 .15em}.fr>span:first-child{border-bottom:1.5px solid currentColor}
sub,sup{font-size:.65em}
header{display:flex;align-items:center;gap:16px;padding:14px 28px;background:linear-gradient(90deg,#0d2b6b,#1f5fd6);color:#fff}
header h1{margin:0;font-size:28px;letter-spacing:2px}
header .mode{margin-left:auto;display:flex;gap:8px}
header .mode button{border:1px solid #fff8;background:transparent;color:#fff;font-size:18px;padding:6px 16px;border-radius:999px;cursor:pointer}
header .mode button.on{background:#fff;color:var(--ink)}
main{display:grid;grid-template-columns:300px 1fr;gap:22px;padding:22px 28px;height:calc(100% - 66px)}
nav{display:flex;flex-direction:column;gap:12px}
nav button{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;border-radius:16px;padding:14px 16px;cursor:pointer;color:var(--ink);font-size:21px;font-weight:700}
nav button small{display:block;font-size:15px;font-weight:400;color:#4a6496;margin-top:4px}
nav button.on{border-color:var(--blue);background:var(--sky);box-shadow:0 4px 14px #1f5fd622}
.robot{margin-top:auto;display:flex;align-items:flex-end;gap:8px}
.robot img{width:120px}
.bubble{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.5}
section.card{background:#fff;border-radius:22px;box-shadow:0 8px 30px #0d2b6b14;padding:30px 38px;display:flex;flex-direction:column;overflow:auto}
.tag{display:inline-block;background:var(--sky);color:var(--blue);font-weight:700;border-radius:999px;padding:4px 14px;font-size:17px}
.src{color:#6a7fa8;font-size:15px;margin-left:10px}
.stem{font-size:27px;line-height:1.9;margin:18px 0 8px}
.body{display:flex;gap:28px;align-items:flex-start}
.body .txt{flex:1}
.body figure{margin:0;flex:0 0 auto}
.body figure img,.body figure svg{max-width:340px;max-height:300px;display:block}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px 30px;font-size:25px;margin:10px 0}
.opts div{padding:6px 12px;border-radius:10px}
.opts div.right{background:#e3f6ec;color:var(--ok);font-weight:700}
.ans{display:none;margin-top:16px;border-left:6px solid var(--ok);background:#f2fbf6;padding:14px 18px;border-radius:0 12px 12px 0;font-size:22px;line-height:1.8}
.ans b{color:var(--ok)}
.tip{margin-top:10px;color:var(--orange);font-weight:700;font-size:20px}
.show .ans{display:block}
.bar{display:flex;gap:14px;margin-top:auto;padding-top:18px;align-items:center}
.bar button{font-size:21px;padding:10px 26px;border-radius:12px;border:0;cursor:pointer;font-weight:700}
.primary{background:var(--blue);color:#fff}.ghost{background:var(--sky);color:var(--blue)}
.count{margin-left:auto;color:#6a7fa8;font-size:17px}
/* 作业模式 */
.hw-list{display:flex;flex-direction:column;gap:12px}
.hw-item{border:2px solid var(--line);border-radius:14px;padding:12px 16px;font-size:19px;line-height:1.8;display:flex;gap:12px}
.hw-item input{width:22px;height:22px;margin-top:6px;flex:0 0 auto}
.hw-item>div{min-width:0;flex:1}
.hw-item figure img,.hw-item figure svg{max-width:100%!important;height:auto}
.hw-item.on{border-color:var(--blue);background:var(--sky)}
.reason{width:100%;font-size:17px;padding:8px;border-radius:8px;border:1px solid var(--line);margin-top:6px;display:none}
.hw-item.on .reason{display:block}
#sheet{display:none;font-size:19px;line-height:1.9}
@media (max-width:820px){
  header{padding:10px 14px}header h1{font-size:20px}header .mode button{font-size:14px;padding:4px 10px}
  main{grid-template-columns:1fr;padding:12px;height:auto}
  nav{flex-direction:row;overflow-x:auto}nav button{min-width:150px;font-size:16px}
  .robot{display:none}section.card{padding:18px}
  .stem{font-size:19px}.opts{font-size:18px;grid-template-columns:1fr}.body{flex-direction:column}
  .body figure img,.body figure svg{max-width:100%}
  .ans{font-size:17px}.hw-item{font-size:16px}.m{white-space:normal}header .mode{flex-shrink:0}
}
</style>
</head>
<body>
<header>
  <h1>小智题库 · 反比例函数</h1>
  <div class="mode"><button id="m1" class="on">课堂即时再练</button><button id="m2">课后作业选题</button></div>
</header>
<main>
  <nav id="nav"></nav>
  <section class="card" id="card"></section>
</main>

// ---- 公式渲染（TeX 子集） ----
function grp(s,i){let d=0,j=i;for(;j<s.length;j++){if(s[j]=='{')d++;else if(s[j]=='}'){d--;if(!d)break}}return [s.slice(i+1,j),j+1]}
function tex(s){let o='',i=0;
 const R={'\\ne':'≠','\\le':'≤','\\ge':'≥','\\leqslant':'≤','\\geqslant':'≥','\\rho':'ρ','\\perp':'⊥','\\triangle':'△','\\times':'×','\\sqrt':'√'};
 while(i<s.length){const c=s[i];
  if(s.startsWith('\\frac',i)){let [a,j]=grp(s,i+5);let [b,k]=grp(s,j);o+='<span class="fr"><span>'+tex(a)+'</span><span>'+tex(b)+'</span></span>';i=k;continue}
  if(c=='\\'){let m=s.slice(i).match(/^\\[a-zA-Z]+/)[0];o+='<span class="n">'+(R[m]||'')+'</span>';i+=m.length;continue}
  if(c=='^'||c=='_'){let t,j;if(s[i+1]=='{'){[t,j]=grp(s,i+1)}else{t=s[i+1];j=i+2}o+=(c=='^'?'<sup>':'<sub>')+tex(t)+(c=='^'?'</sup>':'</sub>');i=j;continue}
  if(c=='{'||c=='}'){i++;continue}
  if(/[0-9()+=,<>|.]/.test(c)){o+='<span class="n">'+c.replace('<','&lt;').replace('>','&gt;')+'</span>';i++;continue}
  if(c=='-'){o+='<span class="n">−</span>';i++;continue}
  o+=c;i++}
 return o}
function md(s){return s.replace(/\$([^$]+)\$/g,(m,t)=>'<span class="m">'+tex(t)+'</span>')}
// ---- 第8题图（按原题重画：y=-3/x，A(-2,2) 在外侧，B(1,-2) 在内侧） ----
function svg8(){const u=40,ox=170,oy=140,X=x=>ox+x*u,Y=y=>oy-y*u;let p1='',p2='';
 for(let i=0;i<=60;i++){let x=-4+i*(3.25/60);p1+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(-3/x).toFixed(1)}
 for(let i=0;i<=60;i++){let x=.75+i*(3.25/60);p2+=(i?'L':'M')+X(x).toFixed(1)+' '+Y(-3/x).toFixed(1)}
 return `<svg viewBox="0 0 340 290" style="width:100%;max-width:340px;height:auto"><g stroke="#0d2b6b" fill="none" stroke-width="1.6"><path d="M10 ${oy}H330M${ox} 280V10"/><path d="${p1}" stroke="#1f5fd6" stroke-width="2.5"/><path d="${p2}" stroke="#1f5fd6" stroke-width="2.5"/></g>
 <path d="M330 ${oy}l-9-5v10zM${ox} 10l-5 9h10z" fill="#0d2b6b"/><circle cx="${X(-2)}" cy="${Y(2)}" r="4.5" fill="#f08a24"/><circle cx="${X(1)}" cy="${Y(-2)}" r="4.5" fill="#f08a24"/>
 <g font-family="Times New Roman" font-style="italic" font-size="19" fill="#0d2b6b"><text x="${X(-2)-82}" y="${Y(2)-8}">A</text><text x="${X(-2)-68}" y="${Y(2)-8}" font-style="normal">(−2, 2)</text><text x="${X(1.3)}" y="${Y(-2.75)}">B</text><text x="${X(1.3)+14}" y="${Y(-2.75)}" font-style="normal">(1, −2)</text><text x="318" y="${oy+24}">x</text><text x="${ox+10}" y="22">y</text><text x="${ox-20}" y="${oy+22}">O</text></g></svg>`}
function fig(f){if(!f)return'';return '<figure>'+(f=='svg8'?svg8():'<img src="'+IMG[f]+'" alt="题图">')+'</figure>'}
// ---- 课堂模式 ----
let mode='class',cur='t1',idx=0;
function list(t){return Q.filter(q=>q.t==t)}
function renderNav(){const nav=document.getElementById('nav');
 nav.innerHTML=TYPES.map(t=>`<button data-t="${t.id}" class="${t.id==cur?'on':''}">${t.name}<small>${t.tip} · ${list(t.id).length} 题</small></button>`).join('')+
 (mode=='class'?`<div class="robot"><img src="${IMG.robot}" alt="小智"><div class="bubble" id="say">选一个错因类型，小智从题库里调一道同类题。</div></div>`:'');
 nav.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur=b.dataset.t;idx=0;render()})}
function renderClass(){const L=list(cur),q=L[idx%L.length],T=TYPES.find(t=>t.id==cur);
 const card=document.getElementById('card');card.className='card';
 card.innerHTML=`<div><span class="tag">${T.name}</span><span class="src">${q.src}</span></div>
 <div class="body"><div class="txt"><div class="stem">${md(q.stem)}</div>
 ${q.opts?'<div class="opts">'+q.opts.map((o,i)=>`<div data-i="${i}">${'ABCD'[i]}．${md(o)}</div>`).join('')+'</div>':''}</div>${fig(q.fig)}</div>
 <div class="ans"><b>答案：</b>${q.opts?'ABCD'[q.a]+'　':''}${q.ans?md(q.ans):''}<br>${md(q.ex)}<div class="tip">防错口诀：${T.tip}</div></div>
 <div class="bar"><button class="primary" id="show">显示答案</button><button class="ghost" id="next">换一题</button><span class="count">第 ${idx%L.length+1} / ${L.length} 题</span></div>`;
 document.getElementById('show').onclick=()=>{card.classList.toggle('show');const r=card.querySelector('.opts div[data-i="'+q.a+'"]');if(r)r.classList.toggle('right',card.classList.contains('show'));
  const s=document.getElementById('say');if(s)s.textContent='记住口诀：'+T.tip+'！'};
 document.getElementById('next').onclick=()=>{idx++;render()};
 const s=document.getElementById('say');if(s)s.textContent='这是一道「'+T.name.slice(2)+'」的同类题，请大家 30 秒口答！'}
// ---- 作业模式 ----
const picked={};
function renderHw(){const card=document.getElementById('card');card.className='card';
 const L=list(cur);
 card.innerHTML=`<div><span class="tag">${TYPES.find(t=>t.id==cur).name}</span><span class="src">勾选你要做的题，写出选择的原因</span></div>
 <div class="hw-list" style="margin-top:14px">${L.map(q=>{const k=Q.indexOf(q),p=picked[k];return `<label class="hw-item ${p!==undefined?'on':''}" data-k="${k}"><input type="checkbox" ${p!==undefined?'checked':''}><div style="flex:1">${md(q.stem)}${q.opts?'<br>'+q.opts.map((o,i)=>'ABCD'[i]+'．'+md(o)).join('　'):''}${q.fig?'<div>'+fig(q.fig).replace('<figure>','<figure style="max-width:260px">')+'</div>':''}<input class="reason" placeholder="我选这道题的原因：" value="${p||''}"></div></label>`}).join('')}</div>
 <div class="bar"><button class="primary" id="mk">生成我的作业单</button><span class="count">已选 ${Object.keys(picked).length} 题</span></div><div id="sheet"></div>`;
 card.querySelectorAll('.hw-item').forEach(el=>{const k=+el.dataset.k,cb=el.querySelector('input[type=checkbox]'),rs=el.querySelector('.reason');
  cb.onchange=()=>{if(cb.checked)picked[k]=rs.value;else delete picked[k];renderHw()};
  rs.onclick=e=>e.preventDefault();rs.oninput=()=>{picked[k]=rs.value}});
 document.getElementById('mk').onclick=()=>{const ks=Object.keys(picked).map(Number).sort((a,b)=>a-b),sh=document.getElementById('sheet');
  sh.style.display='block';sh.innerHTML=ks.length?'<h3>我的个性化作业</h3>'+ks.map((k,i)=>`<p><b>${i+1}．</b>${md(Q[k].stem)}<br><span style="color:#f08a24">选择原因：${picked[k]||'（未填写）'}</span></p>`).join('')+'<p style="color:#6a7fa8">把题目和原因抄在作业本上完成。</p>':'<p>还没有选题哦。</p>'}}
function render(){renderNav();mode=='class'?renderClass():renderHw()}
document.getElementById('m1').onclick=()=>{mode='class';m1.classList.add('on');m2.classList.remove('on');render()};
document.getElementById('m2').onclick=()=>{mode='hw';m2.classList.add('on');m1.classList.remove('on');render()};
if(location.hash=='#zuoye'){document.getElementById('m2').click()}else render();
document.addEventListener('keydown',e=>{if(mode!='class')return;if(e.key==' '||e.key=='Enter'){e.preventDefault();document.getElementById('show').click()}if(e.key=='ArrowRight'||e.key=='PageDown'){idx++;render()}});
</script>
